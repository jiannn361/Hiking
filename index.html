<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>輕量化登山地圖</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 MapLibre GL JS v4 (解決 Sandbox 環境的 SecurityError) -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    
    <!-- 引入 JSZip 用於本地解壓 KMZ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- 引入 Chart.js 繪製高度圖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 引入 LZ-String 用於網址高強度壓縮傳輸 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <!-- 引入 Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0ece1;
            overflow: hidden; 
        }
        
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* GPS 定位點 */
        .user-location-marker {
            background-color: #e27653;
            border: 3px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            transition: all 0.3s ease;
        }
        
        .pulse::after {
            content: "";
            border-radius: 50%;
            height: 36px;
            width: 36px;
            position: absolute;
            margin: -10px 0 0 -10px;
            animation: pulsate 1.5s ease-out;
            animation-iteration-count: infinite;
            opacity: 0;
            border: 2px solid #e27653;
            animation-delay: 1.1s;
        }

        @keyframes pulsate {
            0% { transform: scale(0.1, 0.1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.2, 1.2); opacity: 0; }
        }

        /* 自訂地標的樣式（修復了 transform 造成的亂飛 Bug） */
        .custom-poi-marker {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            /* 拿掉 transform 的變化，僅使用 box-shadow 製造發光效果，避免覆蓋經緯度定位 */
            animation: marker-glow 2s infinite alternate ease-in-out;
        }

        @keyframes marker-glow {
            0% { box-shadow: 0 0 6px rgba(255, 255, 255, 0.6), 0 2px 4px rgba(0, 0, 0, 0.3); }
            100% { box-shadow: 0 0 14px rgba(255, 255, 255, 1), 0 4px 10px rgba(0, 0, 0, 0.5); }
        }

        input[type="file"] {
            display: none;
        }

        .ui-layer {
            z-index: 1000;
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }
        
        /* 隱藏滾動條但保留功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="relative text-[#3e4433] font-sans antialiased">

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 頂部資訊列 -->
    <div class="ui-layer absolute top-10 left-0 right-0 px-4 flex justify-center pointer-events-none transition-all duration-500">
        <div class="bg-[#f0ece1]/90 backdrop-blur-lg rounded-[2rem] p-2 pr-5 flex items-center gap-3 pointer-events-auto border border-white/60 max-w-sm w-full shadow-lg">
            <div class="w-12 h-12 rounded-full bg-[#e8e4d9] flex items-center justify-center shrink-0 border-2 border-white/50 shadow-inner text-[#5c7042]">
                <i data-lucide="mountain-snow" class="w-7 h-7"></i>
            </div>
            <div class="flex flex-col flex-grow overflow-hidden">
                <h1 id="route-title" class="text-sm font-bold text-[#3e4433] truncate">預設專案</h1>
                <div class="flex items-center gap-1 mt-0.5">
                    <i data-lucide="map" class="w-3 h-3 text-[#5c7042]"></i>
                    <span id="gps-status" class="text-[11px] text-[#6b725c] font-medium">尚未定位</span>
                </div>
            </div>
            <button onclick="shareAppLink()" class="w-9 h-9 flex items-center justify-center bg-white/60 rounded-full hover:bg-white transition text-[#6b725c] shrink-0 border border-white/60" title="產生與分享專屬連結">
                <i data-lucide="share" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 右側工具列 -->
    <div class="ui-layer absolute top-28 right-4 flex flex-col gap-2.5 pointer-events-none items-end max-h-[60vh] overflow-y-auto hide-scrollbar pb-4">
        
        <!-- 縮放區塊 -->
        <div class="flex flex-col gap-1 bg-[#f0ece1]/90 backdrop-blur-md rounded-full p-1 border border-white/60 shadow-md pointer-events-auto">
            <button onclick="map.zoomIn()" class="p-2 hover:bg-white rounded-full transition text-[#4a503d]">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
            <div class="w-full h-px bg-white/50 my-0.5"></div>
            <button onclick="map.zoomOut()" class="p-2 hover:bg-white rounded-full transition text-[#4a503d]">
                <i data-lucide="minus" class="w-5 h-5"></i>
            </button>
        </div>

        <button id="btn-layer" onclick="toggleMapStyle()" class="bg-[#f0ece1]/90 backdrop-blur-md rounded-full p-2.5 hover:bg-white active:scale-95 transition text-[#4a503d] pointer-events-auto border border-white/60 shadow-md flex flex-col items-center mt-1 w-[52px]">
            <i data-lucide="layers" class="w-5 h-5"></i>
            <span id="layer-name" class="text-[8px] font-bold mt-0.5 whitespace-nowrap truncate w-full text-center">純衛星(乾淨)</span>
        </button>

        <div id="editor-controls-right" class="flex flex-col gap-2.5 pointer-events-none mt-1">
            <!-- 專案管理按鈕 -->
            <button onclick="openProjectModal()" class="bg-[#f0ece1]/90 backdrop-blur-md rounded-full p-3.5 hover:bg-white transition text-[#4a503d] pointer-events-auto border border-white/60 shadow-md flex flex-col items-center animate-fade-in" title="專案管理">
                <i data-lucide="folder" class="w-5 h-5"></i>
            </button>

            <!-- 匯入按鈕 -->
            <label for="gpx-upload" class="bg-[#f0ece1]/90 backdrop-blur-md border border-white/60 shadow-md rounded-full p-3.5 hover:bg-white cursor-pointer transition text-[#4a503d] pointer-events-auto flex flex-col items-center" title="匯入路線 (GPX/KML)">
                <i data-lucide="download" class="w-5 h-5"></i>
            </label>
            <input type="file" id="gpx-upload" accept=".gpx,.kml,.kmz">

            <!-- 匯出 KML 按鈕 -->
            <button onclick="exportToKML()" class="bg-[#f0ece1]/90 backdrop-blur-md border border-white/60 shadow-md rounded-full p-3.5 hover:bg-white transition text-[#4a503d] pointer-events-auto flex flex-col items-center" title="匯出目前路線為 KML">
                <i data-lucide="upload" class="w-5 h-5"></i>
            </button>

            <!-- 新增地標 -->
            <button id="btn-add-point" onclick="toggleAddPointMode()" class="bg-[#f0ece1]/90 backdrop-blur-md border border-white/60 shadow-md rounded-full p-3.5 hover:bg-white transition text-[#4a503d] pointer-events-auto flex flex-col items-center" title="新增地標">
                <i data-lucide="map-pin" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- 底部高度圖表區 -->
    <div class="ui-layer absolute bottom-28 left-0 right-0 px-4 pointer-events-none flex justify-center">
        <div id="chart-panel" class="w-full max-w-sm bg-[#f0ece1]/95 backdrop-blur-xl rounded-[2rem] p-4 transform translate-y-[150%] opacity-0 transition-all duration-500 pointer-events-auto border border-white/60 shadow-2xl">
            <div class="flex justify-between items-center mb-2 px-2">
                <span class="text-xs font-bold text-[#6b725c] uppercase tracking-wider">路線數據與高度</span>
                <button onclick="toggleChart()" class="text-[#6b725c] hover:text-[#e27653] bg-white/50 rounded-full p-1 border border-white/50">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <div class="flex gap-3 h-36 w-full">
                <!-- 左側數據統計 (修改為 2x2 網格以容納時間資訊) -->
                <div class="grid grid-cols-2 grid-rows-2 gap-x-3 gap-y-2 content-center items-center bg-white/60 rounded-xl p-2 min-w-[110px] shrink-0 border border-white/50 shadow-sm">
                    <div class="flex flex-col items-center" title="總距離">
                        <i data-lucide="route" class="w-3 h-3 text-gray-500 mb-0.5"></i>
                        <span id="stat-dist" class="text-xs font-black text-gray-800">--</span>
                        <span class="text-[9px] text-gray-500">km</span>
                    </div>
                    <div class="flex flex-col items-center" title="預估時間 (依據Naismith法則)">
                        <i data-lucide="clock" class="w-3 h-3 text-blue-500 mb-0.5"></i>
                        <span id="stat-time" class="text-xs font-black text-gray-800">--</span>
                        <span class="text-[9px] text-gray-500">時間</span>
                    </div>
                    <div class="flex flex-col items-center" title="總爬升">
                        <i data-lucide="trending-up" class="w-3 h-3 text-green-600 mb-0.5"></i>
                        <span id="stat-asc" class="text-xs font-black text-green-700">--</span>
                        <span class="text-[9px] text-gray-500">m</span>
                    </div>
                    <div class="flex flex-col items-center" title="總下降">
                        <i data-lucide="trending-down" class="w-3 h-3 text-red-500 mb-0.5"></i>
                        <span id="stat-desc" class="text-xs font-black text-red-600">--</span>
                        <span class="text-[9px] text-gray-500">m</span>
                    </div>
                </div>
                <!-- 右側折線圖 -->
                <div class="flex-grow w-full relative">
                    <canvas id="elevationChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 狀態提示 -->
    <div id="add-point-hint" class="ui-layer absolute top-32 left-1/2 -translate-x-1/2 hidden bg-[#e27653] text-white px-5 py-2.5 rounded-full text-sm font-bold transition-all pointer-events-none shadow-lg">
        請點擊地圖任意處以新增點位
    </div>

    <!-- 底部主控列 -->
    <div class="ui-layer absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none px-4">
        <div class="bg-[#f0ece1]/90 backdrop-blur-xl rounded-full px-6 py-3 flex justify-between items-center gap-6 pointer-events-auto border border-white/60 shadow-lg">
            <button onclick="toggleChart()" class="p-2 rounded-full hover:bg-white text-[#6b725c] transition"><i data-lucide="activity" class="w-6 h-6"></i></button>
            <button id="btn-locate" onclick="toggleGPS()" class="bg-[#e27653] text-white rounded-full px-8 py-3 flex items-center justify-center gap-2 hover:bg-[#d1613e] active:scale-95 transition-all shadow-md">
                <span id="btn-locate-text" class="font-bold text-sm tracking-wide">開始 Start</span>
            </button>
            <button onclick="centerMapToUser()" class="p-2 rounded-full hover:bg-white text-[#6b725c] transition"><i data-lucide="navigation" class="w-6 h-6"></i></button>
        </div>
    </div>

    <!-- 專案管理 Modal -->
    <div id="project-modal" class="ui-layer fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex-col justify-center items-center pointer-events-auto">
        <div class="bg-[#f0ece1] w-[90%] max-w-sm rounded-[2rem] p-6 shadow-2xl flex flex-col gap-4 max-h-[80vh]">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-lg text-[#3e4433] flex items-center gap-2"><i data-lucide="folder-open" class="w-5 h-5 text-[#5c7042]"></i> 專案管理</h2>
                <button onclick="closeProjectModal()" class="text-gray-500 hover:text-gray-800 bg-white/50 rounded-full p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div id="project-list" class="flex flex-col gap-3 overflow-y-auto hide-scrollbar">
                <!-- 專案列表 -->
            </div>

            <button onclick="createNewProject()" class="mt-2 w-full bg-[#5c7042] text-white rounded-xl py-3 font-bold hover:bg-[#4a5a35] transition shadow flex justify-center items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> 建立新專案
            </button>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loading-overlay" class="ui-layer fixed inset-0 bg-[#f0ece1]/80 backdrop-blur-sm hidden flex-col justify-center items-center pointer-events-auto z-[9999]">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-[#5c7042] border-t-transparent"></div>
        <span class="mt-4 font-bold text-[#3e4433]">載入路線中...</span>
    </div>

    <script>
        // --- 全域與專案狀態管理 ---
        const urlParams = new URLSearchParams(window.location.search);
        const isViewOnly = urlParams.get('view') === '1';
        
        let projects = {};
        let currentProjectId = null;

        // 優化：處理 LocalStorage 可能爆滿的例外狀況
        try {
            projects = JSON.parse(localStorage.getItem('hiking_app_projects')) || {};
            currentProjectId = localStorage.getItem('hiking_app_current_id');
        } catch (e) {
            console.error("無法讀取 LocalStorage", e);
            projects = {};
        }

        if (Object.keys(projects).length === 0) {
            currentProjectId = 'proj_' + Date.now();
            projects[currentProjectId] = { id: currentProjectId, name: '預設專案', routePoints: [], markers: [] };
            saveToLocal();
        } else if (!projects[currentProjectId]) {
            currentProjectId = Object.keys(projects)[0];
        }

        function saveToLocal() {
            try {
                localStorage.setItem('hiking_app_projects', JSON.stringify(projects));
                localStorage.setItem('hiking_app_current_id', currentProjectId);
            } catch (e) {
                console.warn("LocalStorage 儲存失敗，容量可能已滿", e);
                alert("瀏覽器快取已滿！請點擊右邊資料夾，刪除不常用的專案，以免紀錄遺失。");
            }
        }

        // --- 1. MapLibre 地圖初始化 (全面改用 Google 圖資，新增「純衛星」模式隔絕干擾) ---
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    // Google 地形圖 ( scale=2 支援高解析度，hl=zh-TW 強制繁體中文)
                    'google-topo': { 
                        type: 'raster', 
                        tiles: ['https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}&scale=2&hl=zh-TW'], 
                        tileSize: 256, 
                        attribution: '&copy; Google' 
                    },
                    // Google 標準地圖
                    'google-standard': { 
                        type: 'raster', 
                        tiles: ['https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&scale=2&hl=zh-TW'], 
                        tileSize: 256, 
                        attribution: '&copy; Google' 
                    },
                    // Google 衛星空照圖 (含街道、商家、標籤混合)
                    'google-satellite': { 
                        type: 'raster', 
                        tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&scale=2&hl=zh-TW'], 
                        tileSize: 256, 
                        attribution: '&copy; Google' 
                    },
                    // Google 純衛星圖 (【完全無標籤、無路名、無景點】！超乾淨，專門烘托您的步道地標)
                    'google-satellite-pure': { 
                        type: 'raster', 
                        tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}&scale=2&hl=zh-TW'], 
                        tileSize: 256, 
                        attribution: '&copy; Google' 
                    }
                },
                layers: [
                    { id: 'topo-layer', type: 'raster', source: 'google-topo', minzoom: 0, maxzoom: 22, layout: { visibility: 'none' } },
                    { id: 'standard-layer', type: 'raster', source: 'google-standard', minzoom: 0, maxzoom: 22, layout: { visibility: 'none' } },
                    { id: 'satellite-layer', type: 'raster', source: 'google-satellite', minzoom: 0, maxzoom: 22, layout: { visibility: 'none' } },
                    { id: 'satellite-pure-layer', type: 'raster', source: 'google-satellite-pure', minzoom: 0, maxzoom: 22, layout: { visibility: 'visible' } } // 預設開啟純衛星
                ]
            },
            center: [120.6015, 23.5937],
            zoom: 13,
            attributionControl: true
        });

        // --- 圖層切換 (修改預設為純衛星) ---
        let currentMapStyle = 'satellite-pure';
        const styles = ['topo', 'standard', 'satellite', 'satellite-pure'];
        const styleNames = { topo: '地形', standard: '標準', satellite: '衛星+標籤', 'satellite-pure': '純衛星(乾淨)' };

        function toggleMapStyle() {
            let idx = (styles.indexOf(currentMapStyle) + 1) % styles.length;
            currentMapStyle = styles[idx];
            map.setLayoutProperty('topo-layer', 'visibility', currentMapStyle === 'topo' ? 'visible' : 'none');
            map.setLayoutProperty('standard-layer', 'visibility', currentMapStyle === 'standard' ? 'visible' : 'none');
            map.setLayoutProperty('satellite-layer', 'visibility', currentMapStyle === 'satellite' ? 'visible' : 'none');
            map.setLayoutProperty('satellite-pure-layer', 'visibility', currentMapStyle === 'satellite-pure' ? 'visible' : 'none');
            document.getElementById('layer-name').textContent = styleNames[currentMapStyle];
        }

        // --- 全域變數 ---
        let routeMarkers = []; // 步道地標物件管理
        let tempPopup = null; // 新增地標時的臨時氣泡
        let targetMarker = null; // 導航目標鎖定地標

        // --- Chart.js 高度表初始化與互動 ---
        let chartHoverMarker = null; // 圖表連動的地圖標記
        
        // 效能最佳化：重複利用 DOM 元素，不反覆銷毀重建，防止拖曳卡死
        function initHoverMarker() {
            if (!chartHoverMarker) {
                const el = document.createElement('div');
                el.className = 'w-4 h-4 bg-[#3b82f6] border-2 border-white rounded-full shadow-md pointer-events-none';
                el.style.display = 'none';
                chartHoverMarker = new maplibregl.Marker({ element: el }).setLngLat([0, 0]).addTo(map);
            }
        }

        const ctx = document.getElementById('elevationChart').getContext('2d');
        let eleChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    { label: '路線高度', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.3)', fill: true, pointRadius: 0, borderWidth: 2, tension: 0.1 },
                    { label: '目前位置', data: [], pointBackgroundColor: '#e27653', pointBorderColor: '#ffffff', pointBorderWidth: 2, pointRadius: 6, showLine: false }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                clip: false, // 防止圖表數字超出切除
                layout: {
                    padding: { left: 5, right: 25, top: 5, bottom: 5 }
                },
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                onHover: (event, activeElements) => {
                    if (activeElements.length > 0) {
                        const index = activeElements[0].index;
                        const proj = projects[currentProjectId];
                        if (proj && proj.routePoints && proj.routePoints[index]) {
                            const pt = proj.routePoints[index];
                            initHoverMarker();
                            chartHoverMarker.setLngLat([pt.lng, pt.lat]);
                            chartHoverMarker.getElement().style.display = 'block';
                        }
                    } else {
                        if (chartHoverMarker) chartHoverMarker.getElement().style.display = 'none';
                    }
                },
                scales: {
                    x: { 
                        type: 'linear', 
                        position: 'bottom', 
                        title: { display: false }, 
                        ticks: { color: '#6b725c', maxRotation: 0, align: 'inner' }, 
                        grid: { display: false } 
                    },
                    y: { title: { display: false }, ticks: { color: '#6b725c' }, grid: { color: 'rgba(107, 114, 92, 0.1)' } }
                },
                plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(62, 68, 51, 0.9)', padding: 10, cornerRadius: 10 } }
            }
        });

        // 大幅降低當機機率：高頻清除機制
        function clearSyncHover() {
            if (chartHoverMarker && chartHoverMarker.getElement().style.display !== 'none') {
                chartHoverMarker.getElement().style.display = 'none';
            }
            if (eleChart) {
                const active = eleChart.getActiveElements();
                if (active && active.length > 0) {
                    eleChart.setActiveElements([]);
                    eleChart.tooltip.setActiveElements([], { x: 0, y: 0 });
                    eleChart.update('none'); // 'none' 關閉不必要動畫，防拖曳當機
                }
            }
        }

        const chartPanelElem = document.getElementById('chart-panel');
        chartPanelElem.addEventListener('mouseleave', clearSyncHover);
        chartPanelElem.addEventListener('touchend', () => {
            setTimeout(clearSyncHover, 300);
        });

        // 地圖拖曳/點擊空白處時自動瞬時清理連動藍點
        window.addEventListener('click', (e) => {
            if (!chartPanelElem.contains(e.target)) clearSyncHover();
        });
        map.on('movestart', clearSyncHover);

        // --- 地圖與高度表「雙向導航連動」---
        map.on('mousemove', 'route-line', (e) => {
            if (e.originalEvent && (e.originalEvent.pointerType === 'touch' || e.originalEvent.touches)) return;
            if (map.isMoving() || map.isDragging() || map.isZooming()) return;

            if (!chartVisible) return;
            const proj = projects[currentProjectId];
            if (!proj || !proj.routePoints || proj.routePoints.length === 0) return;

            const lng = e.lngLat.lng;
            const lat = e.lngLat.lat;

            let closestIdx = 0;
            let minDist = Infinity;
            for (let i = 0; i < proj.routePoints.length; i++) {
                const pt = proj.routePoints[i];
                const dx = pt.lng - lng;
                const dy = pt.lat - lat;
                const dist = dx*dx + dy*dy;
                if (dist < minDist) {
                    minDist = dist;
                    closestIdx = i;
                }
            }

            const pt = proj.routePoints[closestIdx];
            initHoverMarker();
            chartHoverMarker.setLngLat([pt.lng, pt.lat]);
            chartHoverMarker.getElement().style.display = 'block';

            if (eleChart) {
                eleChart.setActiveElements([{ datasetIndex: 0, index: closestIdx }]);
                eleChart.tooltip.setActiveElements([{ datasetIndex: 0, index: closestIdx }], { x: 0, y: 0 });
                eleChart.update('none');
            }
        });

        map.on('mouseleave', 'route-line', clearSyncHover);

        let chartVisible = false;
        function toggleChart() {
            const panel = document.getElementById('chart-panel');
            if (chartVisible) panel.classList.add('translate-y-[150%]', 'opacity-0');
            else panel.classList.remove('translate-y-[150%]', 'opacity-0');
            chartVisible = !chartVisible;
        }

        // --- 載入動畫 ---
        function showLoading() {
            const el = document.getElementById('loading-overlay');
            if(el) { el.classList.remove('hidden'); el.classList.add('flex'); }
        }
        function hideLoading() {
            const el = document.getElementById('loading-overlay');
            if(el) { el.classList.add('hidden'); el.classList.remove('flex'); }
        }

        // --- 跨裝置自動讀取與 URL 引數功能 (修復專案重複生成的 Bug) ---
        map.on('load', () => {
            const routeUrl = urlParams.get('route');
            const shareData = urlParams.get('s');

            if (shareData) {
                showLoading();
                setTimeout(() => {
                    try {
                        const jsonString = LZString.decompressFromEncodedURIComponent(shareData);
                        const data = JSON.parse(jsonString);
                        
                        // 【Bug 修復關鍵】：根據分享內容建立穩定的雜湊值 (Hash)，防止每次打開連結都無限複製新專案
                        let hash = 0;
                        for (let i = 0; i < shareData.length; i++) {
                            const chr = shareData.charCodeAt(i);
                            hash = ((hash << 5) - hash) + chr;
                            hash |= 0; // 轉為 32 位元整數
                        }
                        const stableId = 'proj_shared_' + Math.abs(hash);

                        // 如果本地已經讀取、建立過此分享專案，直接加載它，不建立多餘重複的專案！
                        if (projects[stableId]) {
                            hideLoading();
                            loadProject(stableId);
                            return;
                        }

                        const newProj = { id: stableId, name: data.n || '分享的路線', routePoints: [], markers: [] };

                        let totalDist = 0; let lastPoint = null;
                        let asc = 0; let desc = 0;

                        if (data.p) {
                            data.p.forEach(ptArr => {
                                const pt = { lng: ptArr[0], lat: ptArr[1], ele: ptArr[2] };
                                if (lastPoint) {
                                    totalDist += getDistance(lastPoint.lat, lastPoint.lng, pt.lat, pt.lng);
                                    const diff = pt.ele - lastPoint.ele;
                                    if (diff > 0) asc += diff;
                                    else if (diff < 0) desc += Math.abs(diff);
                                }
                                pt.dist = totalDist;
                                newProj.routePoints.push(pt);
                                lastPoint = pt;
                            });
                            newProj.totalAsc = asc;
                            newProj.totalDesc = desc;
                        }

                        if (data.m) {
                            data.m.forEach((m, i) => {
                                newProj.markers.push({
                                    id: 'poi_shared_' + i, name: m.n, desc: m.d,
                                    lng: m.l[0], lat: m.l[1], color: m.c, icon: m.i
                                });
                            });
                        }

                        projects[stableId] = newProj;
                        if (!isViewOnly) saveToLocal(); 
                        
                        hideLoading();
                        loadProject(stableId);
                    } catch (e) {
                        console.error("解析分享連結失敗:", e);
                        alert("分享連結無效或已損毀！");
                        hideLoading();
                        loadProject(currentProjectId);
                    }
                }, 100);
            } else if (routeUrl) {
                showLoading();
                fetch(routeUrl)
                    .then(res => {
                        if (!res.ok) throw new Error('網路回應錯誤');
                        return res.blob();
                    })
                    .then(blob => {
                        const filename = routeUrl.split('?')[0].split('/').pop() || 'auto-loaded.kml';
                        const file = new File([blob], filename, { type: blob.type });
                        processFile(file);
                    })
                    .catch(err => {
                        console.error("自動載入路線失敗:", err);
                        alert("自動載入失敗，可能存在跨網域 (CORS) 限制。");
                        hideLoading();
                        loadProject(currentProjectId);
                    });
            } else {
                loadProject(currentProjectId);
            }
        });

        function clearCurrentRoute() {
            routeMarkers.forEach(m => m.remove());
            routeMarkers = [];
            if (chartHoverMarker) chartHoverMarker.remove();
            chartHoverMarker = null;
            
            if(eleChart) {
                eleChart.data.datasets[0].data = [];
                eleChart.data.datasets[1].data = [];
                eleChart.update();
            }
            if (map.getSource('route')) {
                map.getSource('route').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } });
            }
        }

        function updateStatsUI(routePoints, originAsc, originDesc) {
            if (!routePoints || routePoints.length === 0) {
                document.getElementById('stat-dist').textContent = '--';
                document.getElementById('stat-asc').textContent = '--';
                document.getElementById('stat-desc').textContent = '--';
                document.getElementById('stat-time').textContent = '--';
                return;
            }
            const dist = routePoints[routePoints.length - 1].dist;
            document.getElementById('stat-dist').textContent = dist.toFixed(2);
            
            const asc = Math.round(originAsc || 0);
            document.getElementById('stat-asc').textContent = asc;
            document.getElementById('stat-desc').textContent = Math.round(originDesc || 0);

            // 預估時間計算 (Naismith's Rule: 距離每 1km=20分, 爬升每 100m=10分)
            const totalMins = Math.round((dist * 20) + (asc / 10));
            let timeStr = '--';
            if (totalMins > 0) {
                if (totalMins < 60) {
                    timeStr = `${totalMins}m`; // 例: 45m
                } else {
                    const h = Math.floor(totalMins / 60);
                    const m = totalMins % 60;
                    timeStr = `${h}h${m}m`; // 例: 2h15m
                }
            }
            document.getElementById('stat-time').textContent = timeStr;
        }

        function loadProject(id) {
            currentProjectId = id;
            saveToLocal();
            const proj = projects[id];
            
            document.getElementById('route-title').textContent = proj.name;
            clearCurrentRoute();

            if (proj.routePoints && proj.routePoints.length > 0) {
                const coords = proj.routePoints.map(p => [p.lng, p.lat]);
                const geojson = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
                
                if (map.getSource('route')) map.getSource('route').setData(geojson);
                else {
                    map.addSource('route', { type: 'geojson', data: geojson });
                    map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#f59e0b', 'line-width': 6, 'line-opacity': 0.9 } });
                }
                
                const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
                map.fitBounds(bounds, { padding: 50 });

                if(eleChart) {
                    eleChart.data.datasets[0].data = proj.routePoints.map(p => ({ x: p.dist, y: p.ele }));
                    
                    // 移除手動 Y 軸範圍裁剪限制，讓 Chart.js 自動且標準地對齊高度範圍
                    delete eleChart.options.scales.y.min;
                    delete eleChart.options.scales.y.max;
                    eleChart.update();
                }
                
                updateStatsUI(proj.routePoints, proj.totalAsc, proj.totalDesc);
                document.getElementById('chart-panel').classList.remove('translate-y-[150%]', 'opacity-0');
                chartVisible = true;
            }

            if (proj.markers) {
                proj.markers.forEach(mData => renderMarker(mData));
            }
        }

                <textarea id="poi-desc" placeholder="輸入介紹/備註..." class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none focus:border-[#5c7042] mt-1 resize-none" rows="2">${mData.desc || ''}</textarea>
                
                <div class="text-[10px] text-gray-500 mt-1 px-1">選擇圖示：</div>
                <div class="flex gap-2 justify-between px-1" id="icon-picker">
                    ${['mountain', 'star', 'P', 'wc', 'tent'].map(icon => `

                            ${icon === 'P' ? '<span class="text-[12px] font-black text-gray-700 pointer-events-none">P</span>' :

                <div class="text-[10px] text-gray-500 mt-1 px-1">選擇顏色：</div>

                    <button id="btn-cancel" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg py-1.5 text-sm transition shadow">取消</button>

            const iconBtns = div.querySelectorAll('.icon-btn');

                iconBtns.forEach(b => { b.classList.remove('ring-2', 'ring-offset-1', 'ring-gray-400', 'bg-gray-200'); b.classList.add('opacity-60', 'bg-gray-100'); });
                this.classList.remove('opacity-60', 'bg-gray-100'); this.classList.add('ring-2', 'ring-offset-1', 'ring-gray-400', 'bg-gray-200');
                selectedIcon = this.dataset.icon;
            }));

            const colorBtns = div.querySelectorAll('.color-btn');
            colorBtns.forEach(btn => btn.addEventListener('click', function() {
                colorBtns.forEach(b => { b.classList.remove('ring-2', 'ring-offset-2'); b.classList.add('opacity-60'); });
                this.classList.remove('opacity-60'); this.classList.add('ring-2', 'ring-offset-2');
                selectedColor = this.dataset.color;
            }));

            div.querySelector('#btn-save').addEventListener('click', () => {
                const name = div.querySelector('#poi-name').value.trim() || '未命名地標';
                const desc = div.querySelector('#poi-desc').value.trim();

        function renderMarker(mData) {
            const el = document.createElement('div');
            el.className = 'custom-poi-marker';
            el.style.backgroundColor = mData.color || '#e27653';
            
            const iconName = mData.icon || 'map-pin';
            if (iconName === 'wc') el.innerHTML = `<span style="font-size: 11px; font-weight: 900; line-height: 1;">WC</span>`;
            else if (iconName === 'P') el.innerHTML = `<span style="font-size: 13px; font-weight: 900; line-height: 1;">P</span>`;
            else el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
            
            setTimeout(() => lucide.createIcons({ root: el }), 0);

            const marker = new maplibregl.Marker({ element: el, draggable: !isViewOnly })
                .setLngLat([mData.lng, mData.lat])
                .addTo(map);
            
            const popup = new maplibregl.Popup({ offset: 15, closeButton: false });
            
            function showViewMode() {
                const div = document.createElement('div');
                div.className = 'p-1 min-w-[150px]';
                let isTarget = targetMarker && targetMarker.id === mData.id;
                
                let html = `<b class="text-sm px-1 text-gray-800 block">${mData.name} ${isTarget ? '🎯' : ''}</b>`;
                if(mData.desc) html += `<p class="text-[11px] text-gray-600 px-1 mt-1 whitespace-pre-wrap">${mData.desc}</p>`;
                
                html += `<div class="flex gap-2 mt-2 pt-2 border-t border-gray-200 px-1">
                    <button class="text-xs ${isTarget ? 'text-gray-400' : 'text-blue-600'} font-bold hover:underline btn-target">${isTarget ? '已鎖定' : '設為目標'}</button>`;
                
                if (!isViewOnly) {
                    html += `<button class="text-xs text-[#5c7042] font-bold hover:underline btn-edit">編輯</button>
                        <button class="text-xs text-red-500 font-bold hover:underline btn-delete">刪除</button>`;
                }
                html += `</div>`;
                div.innerHTML = html;

                div.querySelector('.btn-target').onclick = () => {
                    targetMarker = isTarget ? null : mData;
                    popup.setDOMContent(showViewMode());
                    if (isTracking && lastPosition) {
                        updatePosition(lastPosition); // 立即觸發距離計算重繪
                    }
                };

                if (!isViewOnly) {
                    div.querySelector('.btn-edit').onclick = () => popup.setDOMContent(showEditMode());
                    div.querySelector('.btn-delete').onclick = () => {
                        if (confirm(`確定要刪除地標「${mData.name}」嗎？`)) {
                            if (targetMarker && targetMarker.id === mData.id) targetMarker = null;
                            marker.remove();
                            projects[currentProjectId].markers = projects[currentProjectId].markers.filter(m => m.id !== mData.id);
                            saveToLocal();
                        }
                    };
                }
                return div;
            }

            function showEditMode() {
                return buildMarkerEditorForm(mData, 
                    (updatedData) => {
                        const index = projects[currentProjectId].markers.findIndex(m => m.id === mData.id);
                        if (index !== -1) {
                            projects[currentProjectId].markers[index] = updatedData;
                            saveToLocal();
                            marker.remove();
                            renderMarker(updatedData);
                        }
                    }, 
                    () => popup.setDOMContent(showViewMode())
                );
            }

            popup.setDOMContent(showViewMode());
            marker.setPopup(popup);

            if (!isViewOnly) {
                marker.on('dragend', () => {
                    const lngLat = marker.getLngLat();
                    mData.lat = lngLat.lat;
                    mData.lng = lngLat.lng;
                    const index = projects[currentProjectId].markers.findIndex(m => m.id === mData.id);
                    if (index !== -1) projects[currentProjectId].markers[index] = mData;
                    saveToLocal();
                });
            }

            routeMarkers.push(marker);
        }

        // --- GPX/KML 解析 ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 預估步行時間計算輔助 (Naismith's Rule 模型，假設山區平均步行速度為 3.0 km/h)
        function getEstimatedWalkingTimeStr(dist_km) {
            const totalMins = Math.round(dist_km * 20); // 1 公里 = 20 分鐘
            if (totalMins < 1) return '約 1 分鐘內';
            if (totalMins < 60) return `約 ${totalMins} 分鐘`;
            const hrs = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            return `約 ${hrs} 小時 ${mins} 分鐘`;
        }

        // 高精度調整：上限提升至 3000 點，完整容納一千多點的登山路線，不失真裁切
        function thinRouteData(points, maxPoints = 3000) {
            if (points.length <= maxPoints) return points;
            const step = Math.max(1, Math.floor(points.length / maxPoints));
            return points.filter((_, index) => index % step === 0 || index === points.length - 1);
        }

        function saveImportedData(parsedPts, routeName, importedMarkers = []) {
            let totalDist = 0; let lastPoint = null;
            let asc = 0; let desc = 0;
            
            const routeData = parsedPts.map(pt => {
                if (lastPoint) {
                    totalDist += getDistance(lastPoint.lat, lastPoint.lng, pt.lat, pt.lng);
                    const diff = pt.ele - lastPoint.ele;
                    if (diff > 0) asc += diff;
                    else if (diff < 0) desc += Math.abs(diff);
                }
                lastPoint = pt;
                return { lat: pt.lat, lng: pt.lng, ele: pt.ele, dist: totalDist };
            });

            const thinnedData = thinRouteData(routeData);

            if (parsedPts.length > 0) {
                projects[currentProjectId].routePoints = thinnedData;
                projects[currentProjectId].totalAsc = asc;
                projects[currentProjectId].totalDesc = desc;
            }

            if (importedMarkers && importedMarkers.length > 0) {
                if (!projects[currentProjectId].markers) projects[currentProjectId].markers = [];
                projects[currentProjectId].markers = projects[currentProjectId].markers.concat(importedMarkers);
            }

            if (routeName && projects[currentProjectId].name === '預設專案') {
                projects[currentProjectId].name = routeName;
            }
            saveToLocal();
            loadProject(currentProjectId);
            hideLoading();
        }

        function parseGPXText(gpxData) {
            const xmlDoc = new DOMParser().parseFromString(gpxData, "text/xml");
            const pts = Array.from(xmlDoc.getElementsByTagName("trkpt"));
            if (pts.length === 0) pts.push(...Array.from(xmlDoc.getElementsByTagName("rtept")));

            const parsedPts = pts.map(pt => ({
                lat: parseFloat(pt.getAttribute("lat")),
                lng: parseFloat(pt.getAttribute("lon")),
                ele: pt.getElementsByTagName("ele")[0] ? parseFloat(pt.getElementsByTagName("ele")[0].textContent) : 0
            }));
            
            const wpts = Array.from(xmlDoc.getElementsByTagName("wpt"));
            const importedMarkers = wpts.map((pt, i) => {
                const lat = parseFloat(pt.getAttribute("lat"));
                const lng = parseFloat(pt.getAttribute("lon"));
                const nameNode = pt.getElementsByTagName("name")[0];
                const descNode = pt.getElementsByTagName("desc")[0];
                return {
                    id: 'poi_' + Date.now() + '_wpt_' + i,
                    lat: lat,
                    lng: lng,
                    name: nameNode ? nameNode.textContent.trim() : "未命名地標",
                    desc: descNode ? descNode.textContent.trim() : "",
                    color: '#eab308',
                    icon: 'map-pin'
                };
            });

            const nameNode = xmlDoc.getElementsByTagName("name")[0];
            if (parsedPts.length > 0 || importedMarkers.length > 0) {
                saveImportedData(parsedPts, nameNode ? nameNode.textContent : "匯入的 GPX", importedMarkers);
            } else {
                alert('無效的軌跡檔案');
                hideLoading();
            }
        }

        function parseKMLText(kmlText) {
            try {
                const xmlDoc = new DOMParser().parseFromString(kmlText, "text/xml");
                if (xmlDoc.getElementsByTagName("parsererror").length > 0) throw new Error("XML 解析錯誤");

                let lineStrings = xmlDoc.getElementsByTagName("LineString");
                if (lineStrings.length === 0) lineStrings = xmlDoc.getElementsByTagName("gx:Track");
                
                const parsedPts = [];

                for (let i = 0; i < lineStrings.length; i++) {
                    const coordNode = lineStrings[i].getElementsByTagName("coordinates")[0];
                    if (coordNode) {
                        const coordsArray = coordNode.textContent.trim().split(/\s+/);
                        coordsArray.forEach(pair => {
                            const coords = pair.split(',');
                            if (coords.length >= 2) {
                                const lng = parseFloat(coords[0]);
                                const lat = parseFloat(coords[1]);
                                const ele = coords.length >= 3 ? parseFloat(coords[2]) : 0;
                                if (!isNaN(lat) && !isNaN(lng)) parsedPts.push({ lng, lat, ele });
                            }
                        });
                    } else {
                        const gxCoords = lineStrings[i].getElementsByTagName("gx:coord");
                        Array.from(gxCoords).forEach(node => {
                            const coords = node.textContent.trim().split(' ');
                            if (coords.length >= 2) {
                                parsedPts.push({ lng: parseFloat(coords[0]), lat: parseFloat(coords[1]), ele: parseFloat(coords[2] || 0) });
                            }
                        });
                    }
                }

                const placemarks = xmlDoc.getElementsByTagName("Placemark");
                const importedMarkers = [];
                for (let i = 0; i < placemarks.length; i++) {
                    const pm = placemarks[i];
                    const pointNode = pm.getElementsByTagName("Point")[0];
                    if (pointNode) {
                        const coordNode = pointNode.getElementsByTagName("coordinates")[0];
                        if (coordNode) {
                            const coords = coordNode.textContent.trim().split(',');
                            if (coords.length >= 2) {
                                const lng = parseFloat(coords[0]);
                                const lat = parseFloat(coords[1]);
                                const pmName = pm.getElementsByTagName("name")[0];
                                const pmDesc = pm.getElementsByTagName("description")[0];
                                
                                if (!isNaN(lat) && !isNaN(lng)) {
                                    importedMarkers.push({
                                        id: 'poi_' + Date.now() + '_kml_' + i,
                                        lat: lat,
                                        lng: lng,
                                        name: pmName ? pmName.textContent.trim() : "未命名地標",
                                        desc: pmDesc ? pmDesc.textContent.replace(/(<([^>]+)>)/gi, "").trim() : "",
                                        color: '#eab308', 
                                        icon: 'map-pin'
                                    });
                                }
                            }
                        }
                    }
                }

                const nameNode = xmlDoc.getElementsByTagName("name")[0];
                if (parsedPts.length > 0 || importedMarkers.length > 0) {
                    saveImportedData(parsedPts, nameNode ? nameNode.textContent : "匯入的 KML/KMZ", importedMarkers);
                } else {
                    alert('無法解析此檔案的路線軌跡或地標。請確認其包含有效資料。');
                    hideLoading();
                }
            } catch (err) {
                console.error("KML 解析異常:", err);
                alert('檔案格式解析失敗，檔案可能損毀或格式不正確。');
                hideLoading();
            }
        }

        async function processFile(file) {
            showLoading();
            const name = file.name.toLowerCase();
            if (name.endsWith('.kmz')) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const zip = await JSZip.loadAsync(e.target.result);
                        const kmlFilename = Object.keys(zip.files).find(f => f.toLowerCase().endsWith('.kml'));
                        if (kmlFilename) {
                            const kmlText = await zip.files[kmlFilename].async('string');
                            parseKMLText(kmlText);
                        } else {
                            alert('KMZ 檔案中找不到 KML 路線資料。');
                        }
                    } catch (err) {
                        const fallbackReader = new FileReader();
                        fallbackReader.onload = (ev) => {
                            const content = ev.target.result;
                            if (content.includes('<?xml') || content.includes('<kml')) parseKMLText(content);
                            else alert('無法解析 KMZ 檔案，檔案可能損毀或格式不支援。');
                        };
                        fallbackReader.readAsText(file);
                    }
                };
                reader.readAsArrayBuffer(file);
            } else if (name.endsWith('.kml')) {
                const reader = new FileReader();
                reader.onload = (e) => parseKMLText(e.target.result);
                reader.readAsText(file);
            } else {
                const reader = new FileReader();
                reader.onload = (e) => parseGPXText(e.target.result);
                reader.readAsText(file);
            }
        }
        
        document.getElementById('gpx-upload').addEventListener('change', (e) => {
            if (e.target.files[0]) processFile(e.target.files[0]);
            e.target.value = ''; 
        });

        function exportToKML() {
            const proj = projects[currentProjectId];
            if (!proj || (!proj.routePoints.length && !proj.markers.length)) {
                alert('目前沒有可以匯出的軌跡或地標資料！');
                return;
            }

            let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n    <name>${proj.name || '匯出專案'}</name>\n`;

            if (proj.routePoints && proj.routePoints.length > 0) {
                kml += `    <Placemark>\n      <name>路線軌跡</name>\n      <LineString>\n        <tessellate>1</tessellate>\n        <coordinates>\n`;
                proj.routePoints.forEach(p => {
                    kml += `          ${p.lng},${p.lat},${p.ele || 0}\n`;
                });
                kml += `        </coordinates>\n      </LineString>\n    </Placemark>\n`;
            }

            if (proj.markers && proj.markers.length > 0) {
                proj.markers.forEach(m => {
                    const safeName = (m.name || '未命名地標').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeDesc = (m.desc || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    kml += `    <Placemark>\n      <name>${safeName}</name>\n      <description>${safeDesc}</description>\n      <Point>\n        <coordinates>${m.lng},${m.lat},0</coordinates>\n      </Point>\n    </Placemark>\n`;
                });
            }

            kml += `  </Document>\n</kml>`;

            const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${proj.name || 'route'}.kml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- 新增點位 ---
        let isAddingPoint = false;
        const addPointHint = document.getElementById('add-point-hint');
        const btnAddPoint = document.getElementById('btn-add-point');

        function toggleAddPointMode() {
            isAddingPoint = !isAddingPoint;
            addPointHint.classList.toggle('hidden', !isAddingPoint);
            btnAddPoint.classList.toggle('bg-white', isAddingPoint);
            map.getCanvas().style.cursor = isAddingPoint ? 'crosshair' : '';
        }

        map.on('click', (e) => {
            if (!isAddingPoint) return;
            if (tempPopup) tempPopup.remove();

            const newMarkerData = { id: 'poi_' + Date.now(), lat: e.lngLat.lat, lng: e.lngLat.lng, name: '', desc: '', color: '#e27653', icon: 'mountain' };
            
            const formDOM = buildMarkerEditorForm(newMarkerData, 
                (finalData) => {
                    projects[currentProjectId].markers.push(finalData);
                    saveToLocal();
                    renderMarker(finalData);
                    tempPopup.remove();
                    toggleAddPointMode();
                },
                () => {
                    tempPopup.remove();
                    toggleAddPointMode();
                }
            );

            tempPopup = new maplibregl.Popup({ closeOnClick: false, offset: 15, closeButton: false })
                .setLngLat(e.lngLat)
                .setDOMContent(formDOM)
                .addTo(map);
        });

        // --- 專案管理 ---
        function openProjectModal() {
            renderProjectList();
            document.getElementById('project-modal').classList.remove('hidden');
            document.getElementById('project-modal').classList.add('flex');
        }
        function closeProjectModal() {
            document.getElementById('project-modal').classList.add('hidden');
            document.getElementById('project-modal').classList.remove('flex');
        }
        
        function renderProjectList() {
            const listDiv = document.getElementById('project-list');
            listDiv.innerHTML = '';
            
            Object.values(projects).forEach(proj => {
                const isCurrent = proj.id === currentProjectId;
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 rounded-xl border-2 transition cursor-pointer ${isCurrent ? 'border-[#5c7042] bg-white' : 'border-transparent bg-white/50 hover:bg-white'}`;
                
                div.onclick = (e) => {
                    if (e.target.tagName === 'I' || e.target.tagName === 'BUTTON') return;
                    loadProject(proj.id);
                    closeProjectModal();
                };

                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-sm text-[#3e4433]">${proj.name}</span>
                        <span class="text-[10px] text-gray-500">${proj.routePoints?.length || 0} 個軌跡點, ${proj.markers?.length || 0} 個地標</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="renameProject('${proj.id}')" class="p-2 text-gray-400 hover:text-blue-500 rounded-full hover:bg-gray-100"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        ${!isCurrent ? `<button onclick="deleteProject('${proj.id}')" class="p-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-red-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                    </div>
                `;
                listDiv.appendChild(div);
            });
            lucide.createIcons();
        }

        function createNewProject() {
            const name = prompt('請輸入新專案名稱：');
            if (name && name.trim()) {
                const newId = 'proj_' + Date.now();
                projects[newId] = { id: newId, name: name.trim(), routePoints: [], markers: [] };
                currentProjectId = newId;
                saveToLocal();
                loadProject(newId);
                renderProjectList();
            }
        }
        function renameProject(id) {
            const newName = prompt('重新命名專案：', projects[id].name);
            if (newName && newName.trim()) {
                projects[id].name = newName.trim();
                saveToLocal();
                renderProjectList();
                if (id === currentProjectId) document.getElementById('route-title').textContent = newName.trim();
            }
        }
        function deleteProject(id) {
            if (confirm(`確定要刪除專案「${projects[id].name}」嗎？資料將無法恢復。`)) {
                delete projects[id];
                saveToLocal();
                renderProjectList();
            }
        }

        // --- GPS 定位與動態目標導航 ---
        let watchId = null; let isTracking = false; let userMarker = null;
        const btnLocateText = document.getElementById('btn-locate-text');
        const gpsStatus = document.getElementById('gps-status');
        let lastPosition = null;

        function centerMapToUser() {
            if (userMarker) map.flyTo({ center: userMarker.getLngLat(), zoom: 16 });
            else alert('尚未取得定位資訊，請先點擊「開始」。');
        }

        function toggleGPS() {
            if (!("geolocation" in navigator)) return alert("瀏覽器不支援 GPS");
            if (isTracking) {
                navigator.geolocation.clearWatch(watchId);
                isTracking = false;
                btnLocateText.textContent = "開始 Start";
                gpsStatus.textContent = "GPS 已暫停";
                gpsStatus.classList.remove('text-[#e27653]');
            } else {
                gpsStatus.textContent = "定位中...";
                btnLocateText.textContent = "停止 Stop";
                watchId = navigator.geolocation.watchPosition(updatePosition, () => {
                    gpsStatus.textContent = "定位失敗"; gpsStatus.classList.remove('text-[#e27653]');
                }, { enableHighAccuracy: true });
                isTracking = true;
            }
        }

        let lastGpsCalcTime = 0;
        let lastKnownHeight = null;
        function updatePosition(position) {
            lastPosition = position;
            const lat = position.coords.latitude; const lng = position.coords.longitude;
            let statusText = `精度: ${Math.round(position.coords.accuracy)}m`;

            // 計算與鎖定的導航地標之間的距離以及預估步行時間
            if (targetMarker) {
                const d = getDistance(lat, lng, targetMarker.lat, targetMarker.lng);
                const estimatedTimeStr = getEstimatedWalkingTimeStr(d); // 轉為步行時間字串
                statusText += ` | 距${targetMarker.name.slice(0,4)}: ${d < 1 ? Math.round(d*1000)+'m' : d.toFixed(2)+'km'} (${estimatedTimeStr})`;
            }

            const currentProj = projects[currentProjectId];
            const now = Date.now();
            
            // 每秒最多計算一次軌跡最近點，防止手機高負載發熱
            if (currentProj && currentProj.routePoints && currentProj.routePoints.length > 0) {
                if (now - lastGpsCalcTime > 1000) {
                    let minDist = Infinity; let closestPoint = null;
                    currentProj.routePoints.forEach(p => {
                        const d = getDistance(lat, lng, p.lat, p.lng) * 1000;
                        if (d < minDist) { minDist = d; closestPoint = p; }
                    });
                    if (closestPoint && minDist < 500) {
                        if(eleChart) {
                            eleChart.data.datasets[1].data = [{ x: closestPoint.dist, y: closestPoint.ele }];
                            eleChart.update('none');
                        }
                        lastKnownHeight = Math.round(closestPoint.ele);
                    } else {
                        if(eleChart) {
                            eleChart.data.datasets[1].data = []; eleChart.update('none');
                        }
                        lastKnownHeight = null;
                    }
                    lastGpsCalcTime = now;
                }
            } else {
                lastKnownHeight = null;
            }

            if (lastKnownHeight !== null) {
                statusText += ` | 高: ${lastKnownHeight}m`;
            }

            gpsStatus.textContent = statusText;
            gpsStatus.classList.add('text-[#e27653]');

            if (!userMarker) {
                const el = document.createElement('div'); el.className = 'user-location-marker pulse';
                userMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
                map.flyTo({ center: [lng, lat], zoom: 16 });
            } else {
                userMarker.setLngLat([lng, lat]);
            }
        }

        // --- 初始化 ---
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (isViewOnly) {
                const rightControls = document.getElementById('editor-controls-right');
                if (rightControls) rightControls.style.display = 'none';
            }
        });
        
        function shareAppLink() {
            const proj = projects[currentProjectId];
            if (!proj || (!proj.routePoints.length && !proj.markers.length)) {
                alert('目前沒有路線或地標可以分享！');
                return;
            }
            
            showLoading();
            setTimeout(() => {
                try {
                    const compactData = {
                        n: proj.name,
                        p: proj.routePoints.map(pt => [Math.round(pt.lng*100000)/100000, Math.round(pt.lat*100000)/100000, Math.round(pt.ele)]),
                        m: proj.markers.map(m => ({
                            n: m.name, d: m.desc, 
                            l: [Math.round(m.lng*100000)/100000, Math.round(m.lat*100000)/100000], 
                            c: m.color, i: m.icon
                        }))
                    };
                    
                    const jsonString = JSON.stringify(compactData);
                    const compressed = LZString.compressToEncodedURIComponent(jsonString);
                    const shareUrl = window.location.origin + window.location.pathname + "?s=" + compressed + "&view=1";
                    
                    const tempInput = document.createElement('textarea');
                    tempInput.value = shareUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    
                    alert('✅ 已成功將路線打包並產生專屬連結！\n\n網址已自動複製，您可以直接「貼上」到您的導覽 App 按鈕網址設定中。');
                } catch(e) {
                    console.error(e);
                    alert('產生連結失敗，可能路線資料量過大。');
                }
                hideLoading();
            }, 100);
        }
    </script>
