<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>輕量化登山地圖</title>
    
    <!-- 引入 Tailwind CSS 進行介面排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 MapLibre GL JS (支援 3D 地形) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    
    <!-- 引入 JSZip 用於在本地解壓縮 KMZ 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- 引入 Chart.js 用於繪製高度表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0ece1;
            overflow: hidden; 
        }
        
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* 移除陰影，改用實線與扁平化設計的定位點 */
        .user-location-marker {
            background-color: #e27653;
            border: 3px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            transition: all 0.3s ease;
        }
        
        .pulse::after {
            content: "";
            border-radius: 50%;
            height: 36px;
            width: 36px;
            position: absolute;
            margin: -10px 0 0 -10px;
            animation: pulsate 1.5s ease-out;
            animation-iteration-count: infinite;
            opacity: 0;
            border: 2px solid #e27653; /* 使用邊框取代陰影 */
            animation-delay: 1.1s;
        }

        @keyframes pulsate {
            0% { transform: scale(0.1, 0.1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.2, 1.2); opacity: 0; }
        }

        input[type="file"] {
            display: none;
        }

        .ui-layer {
            z-index: 1000;
        }

        /* MapLibre 隱藏預設版權文字以保持畫面乾淨 */
        .maplibregl-ctrl-bottom-right {
            display: none;
        }
    </style>
</head>
<body class="relative text-[#3e4433] font-sans antialiased">

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 頂部資訊列 (扁平化無陰影) -->
    <div class="ui-layer absolute top-10 left-0 right-0 px-4 flex justify-center pointer-events-none transition-all duration-500">
        <div class="bg-[#f0ece1]/80 backdrop-blur-lg rounded-[2rem] p-2 pr-5 flex items-center gap-3 pointer-events-auto border border-white/60 max-w-sm w-full">
            <div class="w-12 h-12 rounded-full bg-gray-300 overflow-hidden shrink-0 border-2 border-white/50">
                <img src="https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col flex-grow overflow-hidden">
                <h1 id="route-title" class="text-sm font-bold text-[#3e4433] truncate">輕量登山地圖</h1>
                <div class="flex items-center gap-1 mt-0.5">
                    <i data-lucide="map" class="w-3 h-3 text-[#5c7042]"></i>
                    <span id="gps-status" class="text-[11px] text-[#6b725c] font-medium">尚未定位</span>
                </div>
            </div>
            <button onclick="shareAppLink()" class="w-9 h-9 flex items-center justify-center bg-white/40 rounded-full hover:bg-white transition text-[#6b725c] shrink-0 border border-white/60" title="分享純檢視連結">
                <i data-lucide="share" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 右側懸浮控制列 -->
    <div class="ui-layer absolute top-1/4 right-4 flex flex-col gap-3 pointer-events-none">
        <button onclick="map.zoomIn()" class="bg-[#f0ece1]/80 backdrop-blur rounded-full p-2.5 hover:bg-white active:scale-95 transition text-[#4a503d] pointer-events-auto border border-white/60">
            <i data-lucide="plus" class="w-5 h-5"></i>
        </button>
        <button onclick="map.zoomOut()" class="bg-[#f0ece1]/80 backdrop-blur rounded-full p-2.5 hover:bg-white active:scale-95 transition text-[#4a503d] pointer-events-auto border border-white/60">
            <i data-lucide="minus" class="w-5 h-5"></i>
        </button>
        
        <!-- 地圖圖層切換按鈕 -->
        <button id="btn-layer" onclick="toggleMapStyle()" class="bg-[#f0ece1]/80 backdrop-blur rounded-full p-2.5 hover:bg-white active:scale-95 transition text-[#4a503d] pointer-events-auto border border-white/60 flex flex-col items-center justify-center mt-2">
            <i data-lucide="layers" class="w-5 h-5"></i>
            <span id="layer-name" class="text-[9px] font-bold mt-0.5">地形</span>
        </button>

        <!-- 3D 切換按鈕 -->
        <button id="btn-3d" onclick="toggle3D()" class="bg-[#f0ece1]/80 backdrop-blur rounded-full p-2.5 hover:bg-white active:scale-95 transition text-[#4a503d] pointer-events-auto border border-white/60 flex flex-col items-center justify-center mt-2">
            <i data-lucide="box" class="w-5 h-5"></i>
            <span class="text-[9px] font-bold mt-0.5">3D</span>
        </button>
    </div>

    <!-- 編輯者控制區 -->
    <div id="editor-controls" class="ui-layer absolute top-1/2 right-4 flex flex-col gap-4 pointer-events-none -translate-y-1/2 mt-8">
        <!-- 載入路線 -->
        <label for="gpx-upload" class="bg-[#f0ece1]/80 backdrop-blur border border-white/60 rounded-full p-3.5 hover:bg-white cursor-pointer transition text-[#4a503d] pointer-events-auto" title="匯入路線">
            <i data-lucide="folder-open" class="w-5 h-5"></i>
        </label>
        <input type="file" id="gpx-upload" accept=".gpx,.kml,.kmz">

        <!-- 新增點位 -->
        <button id="btn-add-point" onclick="toggleAddPointMode()" class="bg-[#f0ece1]/80 backdrop-blur border border-white/60 rounded-full p-3.5 hover:bg-white transition text-[#4a503d] pointer-events-auto" title="新增地標">
            <i data-lucide="map-pin" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- 底部高度圖表區 -->
    <div class="ui-layer absolute bottom-28 left-0 right-0 px-4 pointer-events-none flex justify-center">
        <div id="chart-panel" class="w-full max-w-sm bg-[#f0ece1]/90 backdrop-blur-xl rounded-[2rem] p-4 transform translate-y-[150%] opacity-0 transition-all duration-500 pointer-events-auto border border-white/60">
            <div class="flex justify-between items-center mb-2 px-2">
                <span class="text-xs font-bold text-[#6b725c] uppercase tracking-wider">高度變化 Elevation</span>
                <button onclick="toggleChart()" class="text-[#6b725c] hover:text-[#e27653] bg-white/40 rounded-full p-1 border border-white/50">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="h-28 w-full">
                <canvas id="elevationChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 新增點位提示 -->
    <div id="add-point-hint" class="ui-layer absolute top-32 left-1/2 -translate-x-1/2 hidden bg-[#e27653] text-white px-5 py-2.5 rounded-full text-sm font-bold transition-all pointer-events-none border border-[#d1613e]">
        請點擊地圖任意處以新增點位
    </div>

    <!-- 底部主控列 (無陰影) -->
    <div class="ui-layer absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none px-4">
        <div class="bg-[#f0ece1]/80 backdrop-blur-lg rounded-full px-6 py-3 flex justify-between items-center gap-6 pointer-events-auto border border-white/60">
            
            <!-- 開關圖表 -->
            <button onclick="toggleChart()" class="p-2 rounded-full hover:bg-white/60 text-[#6b725c] transition">
                <i data-lucide="activity" class="w-6 h-6"></i>
            </button>

            <!-- 追蹤目前位置 -->
            <button id="btn-locate" onclick="toggleGPS()" class="bg-[#e27653] text-white rounded-full px-8 py-3 flex items-center justify-center gap-2 hover:bg-[#d1613e] active:scale-95 transition-all border border-[#d1613e]">
                <span id="btn-locate-text" class="font-bold text-sm tracking-wide">開始 Start</span>
            </button>

            <!-- 定位至自己 -->
            <button onclick="centerMapToUser()" class="p-2 rounded-full hover:bg-white/60 text-[#6b725c] transition">
                <i data-lucide="navigation" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentRouteUrl = null; 
        const urlParams = new URLSearchParams(window.location.search);
        const isViewOnly = urlParams.get('view') === '1';

        // --- 1. MapLibre 地圖初始化 (支援 3D 地形) ---
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'google-terrain': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}'], // Google 地形圖
                        tileSize: 256
                    },
                    'google-standard': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}'], // Google 標準地圖 (含所有店家/詳細路段)
                        tileSize: 256
                    },
                    'google-satellite': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'], // Google 衛星空照圖
                        tileSize: 256
                    },
                    'terrain-dem': {
                        type: 'raster-dem',
                        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], // 免費高程資料庫
                        encoding: 'terrarium',
                        tileSize: 256,
                        maxzoom: 14
                    }
                },
                layers: [
                    {
                        id: 'google-terrain-layer',
                        type: 'raster',
                        source: 'google-terrain',
                        minzoom: 0,
                        maxzoom: 22,
                        layout: { visibility: 'visible' } // 預設顯示地形
                    },
                    {
                        id: 'google-standard-layer',
                        type: 'raster',
                        source: 'google-standard',
                        minzoom: 0,
                        maxzoom: 22,
                        layout: { visibility: 'none' } // 預設隱藏
                    },
                    {
                        id: 'google-satellite-layer',
                        type: 'raster',
                        source: 'google-satellite',
                        minzoom: 0,
                        maxzoom: 22,
                        layout: { visibility: 'none' } // 預設隱藏
                    }
                ]
            },
            center: [120.6015, 23.5937],
            zoom: 13,
            pitch: 0,
            attributionControl: false
        });

        // --- 圖層切換邏輯 ---
        let currentMapStyle = 'terrain';
        const styles = ['terrain', 'standard', 'satellite'];
        const styleNames = { terrain: '地形', standard: '標準', satellite: '衛星' };

        function toggleMapStyle() {
            // 切換到下一個圖層
            let idx = styles.indexOf(currentMapStyle);
            idx = (idx + 1) % styles.length;
            currentMapStyle = styles[idx];

            // 顯示/隱藏對應的地圖層
            map.setLayoutProperty('google-terrain-layer', 'visibility', currentMapStyle === 'terrain' ? 'visible' : 'none');
            map.setLayoutProperty('google-standard-layer', 'visibility', currentMapStyle === 'standard' ? 'visible' : 'none');
            map.setLayoutProperty('google-satellite-layer', 'visibility', currentMapStyle === 'satellite' ? 'visible' : 'none');

            // 更新按鈕文字
            document.getElementById('layer-name').textContent = styleNames[currentMapStyle];
        }

        // --- 3D 視角切換 ---
        let is3D = false;
        function toggle3D() {
            is3D = !is3D;
            const btn = document.getElementById('btn-3d');
            if (is3D) {
                // 開啟 3D，載入高程數據並傾斜相機
                map.setTerrain({ 'source': 'terrain-dem', 'exaggeration': 1.2 });
                map.easeTo({ pitch: 65, bearing: 15, duration: 1500 });
                btn.classList.add('bg-white');
            } else {
                // 關閉 3D，變回 2D 俯視
                map.setTerrain(null);
                map.easeTo({ pitch: 0, bearing: 0, duration: 1500 });
                btn.classList.remove('bg-white');
            }
        }

        // --- 全域變數 ---
        let gpxPointsData = []; 
        let chartVisible = false;
        let routeMarkers = []; // 儲存路線上的點位以供清除

        // --- 2. Chart.js 高度表 ---
        const ctx = document.getElementById('elevationChart').getContext('2d');
        const eleChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: '路線高度', data: [], borderColor: '#5c7042', backgroundColor: 'rgba(92, 112, 66, 0.15)',
                        fill: true, pointRadius: 0, borderWidth: 3, tension: 0.3
                    },
                    {
                        label: '目前位置', data: [], pointBackgroundColor: '#e27653',
                        pointBorderColor: '#ffffff', pointBorderWidth: 2, pointRadius: 6, showLine: false
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'bottom', title: { display: false }, ticks: { color: '#6b725c' }, grid: { display: false } },
                    y: { title: { display: false }, ticks: { color: '#6b725c' }, grid: { color: 'rgba(107, 114, 92, 0.1)' } }
                },
                plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(62, 68, 51, 0.9)', padding: 10, cornerRadius: 10 } }
            }
        });

        function toggleChart() {
            const panel = document.getElementById('chart-panel');
            if (chartVisible) panel.classList.add('translate-y-[150%]', 'opacity-0');
            else panel.classList.remove('translate-y-[150%]', 'opacity-0');
            chartVisible = !chartVisible;
        }

        // --- 3. 路線處理 (純原生 JS 寫法，不依賴 Leaflet) ---
        // 計算兩點經緯度距離 (公里)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function clearCurrentRoute() {
            gpxPointsData = [];
            eleChart.data.datasets[0].data = [];
            eleChart.data.datasets[1].data = [];
            eleChart.update();
            routeMarkers.forEach(m => m.remove());
            routeMarkers = [];
            if (map.getSource('route')) {
                map.getSource('route').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } });
            }
        }

        function processPointsAndRender(latLngEleArray, routeName) {
            let totalDist = 0;
            let lastPoint = null;

            // 準備數據
            latLngEleArray.forEach(pt => {
                if (lastPoint) totalDist += getDistance(lastPoint.lat, lastPoint.lng, pt.lat, pt.lng);
                gpxPointsData.push({ lat: pt.lat, lng: pt.lng, ele: pt.ele, dist: totalDist });
                lastPoint = pt;
            });

            // 在地圖上繪製 GeoJSON 線條
            const coords = gpxPointsData.map(p => [p.lng, p.lat]);
            const geojson = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };

            if (map.getSource('route')) {
                map.getSource('route').setData(geojson);
            } else {
                map.addSource('route', { type: 'geojson', data: geojson });
                map.addLayer({
                    id: 'route-line', type: 'line', source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#5c7042', 'line-width': 6, 'line-opacity': 0.9 }
                });
            }

            // 自動縮放地圖至路線範圍
            if (coords.length > 0) {
                const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
                map.fitBounds(bounds, { padding: 50 });
            }

            // 更新標題與高度圖表
            if (routeName) document.getElementById('route-title').textContent = routeName;
            
            eleChart.data.datasets[0].data = gpxPointsData.map(p => ({ x: p.dist, y: p.ele }));
            eleChart.update();
            
            // 自動展開圖表
            document.getElementById('chart-panel').classList.remove('translate-y-[150%]', 'opacity-0');
            chartVisible = true;

            // 自動啟動 GPS 定位
            if (!isTracking) {
                toggleGPS();
            }
        }

        // 解析 GPX
        function parseGPXText(gpxData) {
            clearCurrentRoute();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(gpxData, "text/xml");
            
            const pts = Array.from(xmlDoc.getElementsByTagName("trkpt"));
            if (pts.length === 0) pts.push(...Array.from(xmlDoc.getElementsByTagName("rtept")));

            const parsedPts = pts.map(pt => {
                const lat = parseFloat(pt.getAttribute("lat"));
                const lng = parseFloat(pt.getAttribute("lon"));
                const eleNode = pt.getElementsByTagName("ele")[0];
                return { lat, lng, ele: eleNode ? parseFloat(eleNode.textContent) : 0 };
            });

            const nameNode = xmlDoc.getElementsByTagName("name")[0];
            if (parsedPts.length > 0) processPointsAndRender(parsedPts, nameNode ? nameNode.textContent : "匯入的 GPX 路線");
            else alert('無效的軌跡檔案');
        }

        // 解析 KML
        function parseKMLText(kmlText) {
            clearCurrentRoute();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(kmlText, "text/xml");
            
            const lineStrings = xmlDoc.getElementsByTagName("LineString");
            const parsedPts = [];

            for (let i = 0; i < lineStrings.length; i++) {
                const coordNode = lineStrings[i].getElementsByTagName("coordinates")[0];
                if (!coordNode) continue;
                coordNode.textContent.trim().split(/\s+/).forEach(pair => {
                    const coords = pair.split(',');
                    if (coords.length >= 2) parsedPts.push({ lng: parseFloat(coords[0]), lat: parseFloat(coords[1]), ele: coords[2] ? parseFloat(coords[2]) : 0 });
                });
            }

            // 處理 KML 標記點
            const placemarks = xmlDoc.getElementsByTagName("Placemark");
            for (let i = 0; i < placemarks.length; i++) {
                const pointNode = placemarks[i].getElementsByTagName("Point")[0];
                if (pointNode) {
                    const name = placemarks[i].getElementsByTagName("name")[0]?.textContent || "標記";
                    const coords = pointNode.getElementsByTagName("coordinates")[0]?.textContent.trim().split(',');
                    if (coords && coords.length >= 2) {
                        const marker = new maplibregl.Marker({ color: '#8b5cf6' })
                            .setLngLat([parseFloat(coords[0]), parseFloat(coords[1])])
                            .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b class="text-sm">${name}</b>`))
                            .addTo(map);
                        routeMarkers.push(marker);
                    }
                }
            }

            const nameNode = xmlDoc.getElementsByTagName("name")[0];
            if (parsedPts.length > 0) processPointsAndRender(parsedPts, nameNode ? nameNode.textContent : "匯入的 KML 路線");
        }

        function processFile(file) {
            const name = file.name.toLowerCase();
            const reader = new FileReader();

            if (name.endsWith('.kmz')) {
                reader.onload = async (e) => {
                    const zip = await JSZip.loadAsync(e.target.result);
                    const kmlFile = Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.kml'));
                    if (kmlFile) parseKMLText(await kmlFile.async('text'));
                };
                reader.readAsArrayBuffer(file);
            } else if (name.endsWith('.kml')) {
                reader.onload = (e) => parseKMLText(e.target.result);
                reader.readAsText(file);
            } else {
                reader.onload = (e) => parseGPXText(e.target.result);
                reader.readAsText(file);
            }
        }

        document.getElementById('gpx-upload').addEventListener('change', (e) => e.target.files[0] && processFile(e.target.files[0]));

        // --- 4. GPS 定位處理 ---
        let watchId = null;
        let isTracking = false;
        let userMarker = null;
        const btnLocateText = document.getElementById('btn-locate-text');
        const gpsStatus = document.getElementById('gps-status');

        function centerMapToUser() {
            if (userMarker) map.flyTo({ center: userMarker.getLngLat(), zoom: 16 });
            else alert('尚未取得定位資訊，請先點擊「開始」。');
        }

        function toggleGPS() {
            if (!("geolocation" in navigator)) return alert("瀏覽器不支援 GPS");

            if (isTracking) {
                navigator.geolocation.clearWatch(watchId);
                isTracking = false;
                btnLocateText.textContent = "開始 Start";
                gpsStatus.textContent = "GPS 已暫停";
                gpsStatus.classList.remove('text-[#e27653]');
            } else {
                gpsStatus.textContent = "定位中...";
                btnLocateText.textContent = "停止 Stop";
                watchId = navigator.geolocation.watchPosition(updatePosition, handleLocationError, { enableHighAccuracy: true });
                isTracking = true;
            }
        }

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            let statusText = `精度: ${Math.round(position.coords.accuracy)}m`;

            if (gpxPointsData.length > 0) {
                let minDist = Infinity;
                let closestPoint = null;
                gpxPointsData.forEach(p => {
                    const d = getDistance(lat, lng, p.lat, p.lng) * 1000;
                    if (d < minDist) { minDist = d; closestPoint = p; }
                });

                if (closestPoint && minDist < 500) {
                    eleChart.data.datasets[1].data = [{ x: closestPoint.dist, y: closestPoint.ele }];
                    eleChart.update();
                    statusText += ` | 高度: ${Math.round(closestPoint.ele)}m`;
                } else {
                    eleChart.data.datasets[1].data = [];
                    eleChart.update();
                }
            }

            gpsStatus.textContent = statusText;
            gpsStatus.classList.add('text-[#e27653]');

            if (!userMarker) {
                const el = document.createElement('div');
                el.className = 'user-location-marker pulse';
                userMarker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
                map.flyTo({ center: [lng, lat], zoom: 16 });
            } else {
                userMarker.setLngLat([lng, lat]);
            }
        }

        function handleLocationError() {
            gpsStatus.textContent = "定位失敗";
            gpsStatus.classList.remove('text-[#e27653]');
        }

        // --- 5. 自訂新增點位 ---
        let isAddingPoint = false;
        const addPointHint = document.getElementById('add-point-hint');

        function toggleAddPointMode() {
            isAddingPoint = !isAddingPoint;
            addPointHint.classList.toggle('hidden', !isAddingPoint);
            map.getCanvas().style.cursor = isAddingPoint ? 'crosshair' : '';
        }

        map.on('click', (e) => {
            if (!isAddingPoint) return;
            const name = prompt("請為此地點輸入名稱：");
            if (name && name.trim()) {
                new maplibregl.Marker({ color: '#e27653' })
                    .setLngLat([e.lngLat.lng, e.lngLat.lat])
                    .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b class="text-sm">${name}</b>`))
                    .addTo(map).togglePopup();
            }
            toggleAddPointMode();
        });

        // --- 6. 網址參數載入 ---
        window.addEventListener('DOMContentLoaded', () => {
            if (isViewOnly) document.getElementById('editor-controls').style.display = 'none';

            const routeUrl = urlParams.get('route');
            if (routeUrl) {
                currentRouteUrl = routeUrl;
                fetch(routeUrl).then(res => res.blob()).then(blob => {
                    processFile(new File([blob], routeUrl.split('/').pop() || 'route.gpx'));
                });
            }
        });

        function shareAppLink() {
            let shareUrl = window.location.origin + window.location.pathname;
            shareUrl += currentRouteUrl ? `?route=${encodeURIComponent(currentRouteUrl)}&view=1` : `?view=1`;
            if (navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(() => alert('已複製純檢視模式連結！'));
        }

    </script>
</body>
</html>
